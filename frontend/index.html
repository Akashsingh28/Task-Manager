<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Team Task Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="auth-page">
    <div class="auth-container">
      <h1>TaskNovaZone</h1>
      <div class="tabs">
        <button type="button" class="tab-btn active" data-tab="login">Login</button>
        <button type="button" class="tab-btn" data-tab="register">Sign Up</button>
      </div>
      <form id="login-form" class="tab-content active">
        <h2>Login</h2>
        <input type="email" id="login-email" placeholder="Email" required />
        <input type="password" id="login-password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>

      <form id="register-form" class="tab-content">
        <h2>Sign Up</h2>
        <input type="text" id="register-name" placeholder="Full Name" required />
        <input type="email" id="register-email" placeholder="Email" required />
        <input type="password" id="register-password" placeholder="Password" required />
        <button type="submit">Register</button>
      </form>
    </div>
  </div>

  <div id="dashboard-page" style="display:none">
    <nav class="navbar">
      <h1>TaskNovaZone</h1>
      <div class="nav-right">
        <span id="user-welcome"></span>
        <button id="logout-btn">Logout</button>
      </div>
    </nav>

    <div class="dashboard-container">
      <aside class="sidebar">
        <h3>Menu</h3>
        <button class="sidebar-btn active" onclick="switchView('stats')">Dashboard</button>
        <button class="sidebar-btn" onclick="switchView('projects')">Projects</button>
      </aside>

      <main class="main-content">
        <!-- Stats View -->
        <div id="stats-view" class="view active">
          <div class="view-header">
            <h2>Dashboard</h2>
            <select id="dashboard-project-filter" onchange="loadDashboardStats()" style="padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); font-family: 'Poppins', sans-serif;">
              <option value="all">All Projects</option>
            </select>
          </div>
          <div class="stats-grid">
            <div class="stat-card">
              <h4>Total Projects</h4>
              <p id="total-projects">0</p>
            </div>
            <div class="stat-card">
              <h4>Team Members</h4>
              <p id="total-members">0</p>
            </div>
            <div class="stat-card">
              <h4>Total Tasks</h4>
              <p id="total-tasks">0</p>
            </div>
            <div class="stat-card">
              <h4>In Progress</h4>
              <p id="in-progress-tasks">0</p>
            </div>
          </div>
          
          <div class="charts-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px;">
            <div class="chart-section">
              <h3>Task Status</h3>
              <div style="position: relative; height: 250px;">
                <canvas id="statusChart"></canvas>
              </div>
            </div>
            <div class="chart-section">
              <h3>Task Priority</h3>
              <div style="position: relative; height: 250px;">
                <canvas id="priorityChart"></canvas>
              </div>
            </div>
            <div class="chart-section" style="grid-column: 1 / -1;">
              <h3>Tasks by Assignee</h3>
              <div style="position: relative; height: 300px;">
                <canvas id="userChart"></canvas>
              </div>
            </div>
          </div>
        </div>

        <!-- Projects View -->
        <div id="projects-view" class="view">
          <div class="view-header">
            <h2>Projects</h2>
            <button onclick="openCreateProjectModal()">+ New Project</button>
          </div>
          <div id="projects-list" class="projects-grid"></div>
        </div>

        <!-- Project Detail View -->
        <div id="project-detail-view" class="view">
          <button onclick="switchView('projects')" class="back-btn">← Back to Projects</button>
          <div id="project-header"></div>
          <div class="project-tabs">
            <button class="project-tab active" onclick="switchProjectTab('tasks')">Tasks</button>
            <button class="project-tab" onclick="switchProjectTab('members')">Members</button>
          </div>
          <div id="tasks-section" class="project-tab-content active">
            <div style="display: flex; gap: 15px; margin-bottom: 20px;">
              <button onclick="openCreateTaskModal()">+ New Task</button>
              <button id="add-column-btn" onclick="addColumn()" style="background: var(--surface-2); color: var(--primary); border: 1px solid var(--border);">+ Add Column</button>
            </div>
            <div id="kanban-board" class="kanban-board"></div>
          </div>
          <div id="members-section" class="project-tab-content">
            <div id="members-list"></div>
            <form id="add-member-form">
              <input type="email" id="member-email" placeholder="Enter email to add" required />
              <button type="submit">Add Member</button>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal for creating project -->
  <div id="create-project-modal" class="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModals()">&times;</button>
      <h2>Create New Project</h2>
      <form id="create-project-form">
        <input type="text" id="project-name" placeholder="Project Name" required />
        <textarea id="project-desc" placeholder="Description"></textarea>
        <button type="submit">Create</button>
      </form>
    </div>
  </div>

  <!-- Modal for creating task -->
  <div id="create-task-modal" class="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModals()">&times;</button>
      <h2>Create New Task</h2>
      <form id="create-task-form">
        <input type="text" id="task-title" placeholder="Task Title" required />
        <textarea id="task-desc" placeholder="Description"></textarea>
        <input type="date" id="task-due" />
        <select id="task-priority">
          <option value="Low">Low Priority</option>
          <option value="Medium" selected>Medium Priority</option>
          <option value="High">High Priority</option>
        </select>
        <button type="submit">Create</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
